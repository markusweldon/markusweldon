name: Activity Graph

on:
  schedule:
    - cron: "15 0 * * *"   # Daily, staggered from metrics.yml and pacman.yml
  workflow_dispatch:
  push:
    branches: ["fix/activity-graph-action"]   # TEMP: for testing on this branch; switch to main/master before merge

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout existing output branch content
        uses: actions/checkout@v4
        with:
          ref: output
          path: existing-output

      - name: Assemble dist directory
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' existing-output/ dist/

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: markusweldon
          options: theme=synthwave-84&hide_title=true&line=D33D9B
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
