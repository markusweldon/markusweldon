name: Metrics

on:
  schedule:
    - cron: "30 0 * * *"   # daily, 30 min after the Pac-Man job
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-publish
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics card
        # Pinned to the commit @latest currently resolves to (lowlighter/metrics has no
        # tagged releases newer than v3.34, but actively maintains the "latest" branch).
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Render only: the steps below cap the calendar, then commit to the metrics branch
          output_action: none
          filename: github-metrics.svg
          user: markusweldon
          template: classic
          base: ""
          config_display: large
          config_timezone: America/Los_Angeles
          config_animations: "yes"

          # The signature "premium" visual: isometric 3D contribution calendar
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year

          # Language breadth
          plugin_languages: "yes"
          plugin_languages_indepth: "yes"
          plugin_languages_details: percentage
          plugin_languages_limit: 6

          # Synthwave theming. metrics has no dark toggle, so override its CSS.
          # (Verify + tune against the first CI-rendered SVG.)
          extras_css: |
            svg { background: #292138; color: #d9d7ee; }
            h1, h2, h3, .title { color: #D33D9B !important; }
            a, .key, .value { color: #6DE2F1 !important; }
            /* Recolor the isometric contribution calendar to a synthwave ramp.
               The cells are inline fill attributes (specificity 0), so plain
               attribute selectors override them. Low -> high activity. */
            [fill="#ebedf0"] { fill: #2a2143 !important; }
            [fill="#9be9a8"] { fill: #4c3f72 !important; }
            [fill="#40c463"] { fill: #8957E5 !important; }
            [fill="#30a14e"] { fill: #D33D9B !important; }
            [fill="#216e39"] { fill: #6DE2F1 !important; }
            /* Languages bar: kill the white track and near-white segments */
            [fill="white"]   { fill: #1c1626 !important; }
            [fill="#ededed"] { fill: #4C4A73 !important; }
            [fill="#d1d5da"] { fill: #4C4A73 !important; }

      # One very busy day flattens every other tower in the isocalendar, because the
      # plugin scales each day to the busiest one. Cap it: 40 contributions is full height.
      - name: Checkout the cap script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Cap the isocalendar towers
        run: python3 -I .github/scripts/cap_isocalendar.py /metrics_renders/github-metrics.svg "$RUNNER_TEMP/github-metrics.svg" 40

      - name: Publish to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/metrics-branch"
          git clone --quiet --depth 1 --branch metrics "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dir"
          cp "$RUNNER_TEMP/github-metrics.svg" "$dir/github-metrics.svg"
          cd "$dir"
          if git diff --quiet; then echo "No change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -am "Update github-metrics.svg"
          git push --quiet origin metrics
