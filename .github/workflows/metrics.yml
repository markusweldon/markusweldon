name: Metrics

on:
  schedule:
    - cron: "30 0 * * *"   # daily at 00:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-publish
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics card
        # Pinned to the commit @latest currently resolves to (lowlighter/metrics has no
        # tagged releases newer than v3.34, but actively maintains the "latest" branch).
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Render only: the steps below cap the calendar, then commit to the metrics branch
          output_action: none
          filename: github-metrics.svg
          user: markusweldon
          template: classic
          base: ""
          config_display: large
          config_timezone: America/Los_Angeles
          config_animations: "yes"

          # The signature "premium" visual: isometric 3D contribution calendar
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year

          # Language breadth
          plugin_languages: "yes"
          plugin_languages_indepth: "yes"
          plugin_languages_details: percentage
          plugin_languages_limit: 6

          # markusweldon.com theming. metrics has no dark toggle, so override its CSS.
          # (Verify + tune against the first CI-rendered SVG.)
          extras_css: |
            svg { background: #130022; color: #a78bca; }
            h1, h2, h3, .title { color: #f92aad !important; }
            a, .key, .value { color: #36f9f6 !important; }
            /* Recolor the isometric contribution calendar to a synthwave ramp.
               The cells are inline fill attributes (specificity 0), so plain
               attribute selectors override them. Low -> high activity. */
            [fill="#ebedf0"] { fill: #1c0033 !important; }
            [fill="#9be9a8"] { fill: #6e4f8e !important; }
            [fill="#40c463"] { fill: #b01fff !important; }
            [fill="#30a14e"] { fill: #f92aad !important; }
            [fill="#216e39"] { fill: #36f9f6 !important; }
            /* Languages bar: kill the white track and near-white segments */
            [fill="white"]   { fill: #0d0015 !important; }
            [fill="#ededed"] { fill: #6e4f8e !important; }
            [fill="#d1d5da"] { fill: #6e4f8e !important; }

      # One very busy day flattens every other tower in the isocalendar, because the
      # plugin scales each day to the busiest one. Cap it: 30 contributions is full height.
      - name: Checkout the README scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Cap the isocalendar towers
        run: python3 -I .github/scripts/cap_isocalendar.py /metrics_renders/github-metrics.svg "$RUNNER_TEMP/capped.svg" 30

      # Colour towers by height on a neon grid floor, then frame the card like the
      # README's project cards.
      - name: Restyle the calendar and frame the card
        run: |
          python3 -I .github/scripts/skyline_isocalendar.py "$RUNNER_TEMP/capped.svg" "$RUNNER_TEMP/skyline.svg"
          python3 -I .github/scripts/frame_card.py "$RUNNER_TEMP/skyline.svg" "$RUNNER_TEMP/github-metrics.svg"

      # The streak card comes from the self-hosted streak service with a transparent
      # background, gets the same frame, and is published next to the metrics card.
      # If the service is down, yesterday's card stays in place.
      - name: Fetch and frame the streak card
        continue-on-error: true
        run: |
          set -euo pipefail
          url="https://markus-weldon-github-readme-streak-stats.vercel.app/?user=markusweldon&hide_border=true&border_radius=0&background=00000000&fire=36f9f6&ring=f92aad&stroke=f92aad&currStreakNum=f92aad&sideNums=f92aad&currStreakLabel=36f9f6&sideLabels=36f9f6&dates=a78bca&card_width=830"
          curl -fsS --retry 3 --max-time 30 -o "$RUNNER_TEMP/streak-raw.svg" "$url"
          python3 -I - "$RUNNER_TEMP/streak-raw.svg" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          assert root.tag == "{http://www.w3.org/2000/svg}svg", "Expected an SVG document"
          PY
          python3 -I .github/scripts/frame_card.py "$RUNNER_TEMP/streak-raw.svg" "$RUNNER_TEMP/streak-stats.svg"

      - name: Publish to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/metrics-branch"
          git clone --quiet --depth 1 --branch metrics "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dir"
          cp "$RUNNER_TEMP/github-metrics.svg" "$dir/github-metrics.svg"
          if [ -s "$RUNNER_TEMP/streak-stats.svg" ]; then
            cp "$RUNNER_TEMP/streak-stats.svg" "$dir/streak-stats.svg"
          fi
          cd "$dir"
          git add -A
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Update github-metrics.svg and streak-stats.svg"
          git push --quiet origin metrics
